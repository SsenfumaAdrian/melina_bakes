name: melina_bakes_client
description: Melina Bakes — Flutter Web customer and admin application.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  melina_bakes_shared:
    path: ../melina_bakes_shared
  melina_bakes_client:
    path: ../melina_bakes_server/melina_bakes_client

  # State Management & DI
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Routing
  go_router: ^14.2.0

  # Networking
  dio: ^5.5.0
  retrofit: ^4.1.0

  # Serialization & Models
  freezed_annotation: ^2.4.1
  json_annotation: ^4.9.0

  # UI
  flutter_animate: ^4.5.0
  responsive_framework: ^1.5.1
  cached_network_image: ^3.4.0
  shimmer: ^3.0.0
  flutter_svg: ^2.0.10
  google_fonts: ^6.2.1

  # Utilities
  intl: ^0.19.0
  uuid: ^4.4.0
  equatable: ^2.0.5
  dartz: ^0.10.1
  logger: ^2.3.0
  shared_preferences: ^2.2.3
  flutter_secure_storage: ^9.2.2
  url_launcher: ^6.3.0
  image_picker: ^1.1.2
  file_picker: ^8.0.6

  # Localization
  flutter_localizations:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.12
  freezed: ^2.5.7
  json_serializable: ^6.8.0
  riverpod_generator: ^2.4.0
  riverpod_lint: ^2.3.10
  retrofit_generator: ^8.1.0
  go_router_builder: ^2.7.0
  mocktail: ^1.0.4
  bloc_test: ^9.1.7

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/fonts/
