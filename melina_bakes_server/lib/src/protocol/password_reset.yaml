### Password Reset Entity
### Tracks password reset requests with expiry.
class: PasswordReset
 table: password_resets
 fields:
   ### Relations
   userId: int, parent=users

   ### Token
   tokenHash: String, unique

   ### Status
   usedAt: DateTime?
   expiresAt: DateTime

   ### Request metadata
   ipAddress: String?
   userAgent: String?

   ### Timestamps
   createdAt: DateTime

 indexes:
   pr_token_idx: tokenHash
   pr_user_idx: userId
   pr_expires_idx: expiresAt
