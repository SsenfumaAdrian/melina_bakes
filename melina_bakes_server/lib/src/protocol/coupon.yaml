### Coupon Entity
### Discount coupons and promo codes.
class: Coupon
 table: coupons
 fields:
   ### Identity
   code: String, unique
   name: String
   description: String?

   ### Type & Value
   type: CouponType
   value: double
   minimumOrderAmount: double?
   maximumDiscount: double?

   ### Limits
   usageLimit: int?
   usageCount: int
   usageLimitPerUser: int?

   ### Validity
   startsAt: DateTime
   expiresAt: DateTime?

   ### Scope
   applicableProducts: List<int>?
   applicableCategories: List<int>?
   excludedProducts: List<int>?

   ### Status
   isActive: bool

   ### Timestamps
   createdAt: DateTime
   updatedAt: DateTime
   deletedAt: DateTime?

 indexes:
   coupon_code_idx: code
   coupon_active_idx: isActive
   coupon_dates_idx: startsAt, expiresAt
