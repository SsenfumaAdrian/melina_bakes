version: '3.9'

services:
  postgres:
    image: postgres:15-alpine
    container_name: melina_bakes_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: melina_admin
      POSTGRES_PASSWORD: ${DB_PASSWORD:-melina_secure_password_2024}
      POSTGRES_DB: melina_bakes_dev
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --locale=en_US.UTF-8"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U melina_admin -d melina_bakes_dev"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - melina_network

  redis:
    image: redis:7-alpine
    container_name: melina_bakes_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - melina_network

  nginx:
    image: nginx:alpine
    container_name: melina_bakes_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.dev.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - server
    networks:
      - melina_network

  server:
    build:
      context: ../melina_bakes_server
      dockerfile: ../docker/Dockerfile.server
    container_name: melina_bakes_server
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql://melina_admin:${DB_PASSWORD:-melina_secure_password_2024}@postgres:5432/melina_bakes_dev
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET:-melina_jwt_secret_key_change_in_production}
      - ENVIRONMENT=development
    ports:
      - "8080:8080"
      - "8081:8081"
    volumes:
      - ../melina_bakes_server:/app
      - server_pub_cache:/root/.pub-cache
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - melina_network
    command: dart bin/main.dart --apply-migrations

volumes:
  postgres_data:
  redis_data:
  server_pub_cache:

networks:
  melina_network:
    driver: bridge
