name: melina_bakes

packages:
  - melina_bakes_shared
  - melina_bakes_server
  - melina_bakes_client

scripts:
  analyze:
    run: melos exec -- "dart analyze --fatal-infos"
    description: Run dart analyze in all packages

  format:
    run: melos exec -- "dart format ."
    description: Format all Dart code

  format-check:
    run: melos exec -- "dart format --set-exit-if-changed ."
    description: Check formatting in all packages

  test:
    run: melos run test:selective
    description: Run all tests

  test:selective:
    run: melos exec --dir-exists=test -- "dart test"
    description: Run tests in packages that have them

  generate:
    run: |
      cd melina_bakes_server && dart run serverpod_cli generate
    description: Generate Serverpod code

  build:server:
    run: |
      cd melina_bakes_server && dart compile exe bin/main.dart -o bin/server
    description: Compile server to executable

  build:web:
    run: |
      cd melina_bakes_client && flutter build web --release
    description: Build Flutter web for production

  bootstrap:
    run: |
      melos bootstrap
    description: Bootstrap all packages

  clean:
    run: |
      melos exec -- "flutter clean || dart clean"
    description: Clean all packages

  get:
    run: |
      melos exec -- "flutter pub get || dart pub get"
    description: Get dependencies for all packages

  dev:up:
    run: |
      docker-compose -f docker/docker-compose.dev.yml up -d
    description: Start development infrastructure

  dev:down:
    run: |
      docker-compose -f docker/docker-compose.dev.yml down
    description: Stop development infrastructure

  dev:logs:
    run: |
      docker-compose -f docker/docker-compose.dev.yml logs -f
    description: View development logs
