name: CI — Melina Bakes

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-shared:
    name: Analyze Shared Package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: melina_bakes_shared
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: '3.14.0'
      - run: dart pub get
      - run: dart analyze --fatal-infos

  analyze-server:
    name: Analyze Server
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: melina_bakes_server
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: '3.14.0'
      - run: dart pub get
      - run: dart analyze

  analyze-client:
    name: Analyze Flutter Client
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: melina_bakes_client
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.0'
          channel: stable
      - run: flutter pub get
      - run: flutter analyze

  test-server:
    name: Test Server
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [analyze-shared, analyze-server]
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: melina_admin
          POSTGRES_PASSWORD: melina_secure_password_2024
          POSTGRES_DB: melina_bakes_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: melina_bakes_server
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: '3.14.0'
      - run: dart pub get
      - run: dart test
        env:
          DATABASE_URL: postgresql://melina_admin:melina_secure_password_2024@localhost:5432/melina_bakes_test

  test-client:
    name: Test Flutter Client
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: analyze-client
    defaults:
      run:
        working-directory: melina_bakes_client
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.0'
          channel: stable
      - run: flutter pub get
      - run: flutter test

  build-client:
    name: Build Flutter Web
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [analyze-client, test-client]
    defaults:
      run:
        working-directory: melina_bakes_client
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.0'
          channel: stable
      - run: flutter pub get
      - run: flutter build web --release --base-href /
      - uses: actions/upload-artifact@v4
        with:
          name: flutter-web-build
          path: melina_bakes_client/build/web/
          retention-days: 7