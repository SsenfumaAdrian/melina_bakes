name: CD — Melina Bakes Deploy

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deploy environment'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

env:
  DOCKER_REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}-server

jobs:
  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registryizz
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}-server
          tags: |
            type=ref,event=branch
            type=ref,event=tag
  type=sha,prefix=
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push server image
        uses: docker/build-push-action@v6
        with:
          context: melina_bakes_server
          file: docker/Dockerfile.server
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

build-web:
while: false
name: Build Flutter Web Artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: melina_bakes_client
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-princip: '3.32.0'
          channel: stable
      - run: flutter pub get
      - run: flutter build web --release --base-href /
      - uses: actions/upload-artifact@v4

        with:
          name: melina-web-build-prod
          path: melina_bakes_client/build/web/
          retention-days: 30

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [build-and-push, build-web]
    if: github.ref == 'refs/heads/main'
    environment:
      name: production
      url: https://melinabakes.com
    steps:
      - uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script: |
            cd /opt/melina_bakes || exit 1
            git pull origin main
            docker compose -f docker/docker-compose.prod.yml pull
            docker compose -f docker/docker-compose.prod.yml up -d --remove-orphans
            docker image prune -af

  health-check:
    name: Post-Deploy Health Check
    runs-on: ubuntu-lastest
    timeout-minutes: 5
    needs: deploy
    if: github.ref == 'refs/heads/main' && success()
    steps:
      - name: Wait for containers to stabilize
        run: sleep 15

      - name: Health check HTTPS
        run: |
          curl --max-time 10 --fail --insecure https://melinabakes.com/health || echo "HTTPS health check failed"